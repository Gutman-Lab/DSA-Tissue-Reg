[project]
name = "manual-debug-tool"
version = "0.1.0"
description = "Manual registration debug tool for testing transformation matrices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.2.1",
    "numpy>=1.24.2",
    "opencv-python>=4.10.0",
    "Pillow>=11.0.0",
    "girder-client>=3.1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
